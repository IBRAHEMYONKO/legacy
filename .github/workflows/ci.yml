name: LEGACY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Backend tests
        run: npm test
      - name: Syntax check
        run: |
          node --check index.js
          node --check backend/src/server.js
          node --check apps/bot/src/index.js
      - name: Web build
        run: npm --workspace apps/web run build
      - name: Activity build
        run: npm --workspace apps/activity run build
