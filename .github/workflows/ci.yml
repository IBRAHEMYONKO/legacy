name: LEGACY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: node --check backend/src/server.js
      - run: node --check apps/bot/src/index.js
      - run: npm --workspace apps/web run build
      - run: npm --workspace apps/activity run build
